[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sam3d_objects"
version = "0.0.2"
requires-python = ">=3.10"
dependencies = [
  # Core inference dependencies (torch/torchvision/gsplat/MoGe provided by host project)
  "astor",
  "easydict",
  "hydra-core",
  "igraph",
  "lightning",
  "loguru",
  "numpy",
  "omegaconf",
  "open3d",
  "optree",
  "pillow",
  "plyfile",
  "pymeshfix",
  "roma",
  "safetensors",
  "scipy",
  "seaborn",
  "timm",
  "trimesh",
  "utils3d",
  "xatlas",
  "huggingface-hub",
  "imageio",
  "matplotlib",
  "tqdm",
  "einops",
  "ftfy",
]

[project.optional-dependencies]
# Heavy GPU deps - install separately with matching CUDA/torch versions
gpu = [
  "pytorch3d",
  "kaolin",
  "flash-attn",
  "xformers",
]

[tool.hatch.build]
ignore-vcs = true
include = ["**/*.py"]
exclude = ["conftest.py", "*_test.py"]
packages = ["sam3d_objects"]

[tool.hatch.metadata]
allow-direct-references = true
